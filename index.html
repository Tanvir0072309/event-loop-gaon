 P.forEach((p,i)=>{const q=P[Math.min(i+1,70)],o=P[Math.max(i-1,0)],tx=q.x-o.x,tz=q.z-o.z,l=Math.hypot(tx,tz),nx=-tz/l*w/2,nz=tx/l*w/2;

function instrument(code){
 const W='async function __main(){\n'+code+'\n}';
 const ast=acorn.parse(W,{ecmaVersion:2022,preserveParens:true});
 const ed=[],aw=[],lbs=new Map(),fnS=[],lineOf=p=>W.slice(0,p).split('\n').length-1;
 let o=0;const add=(s,e,t,sf=0)=>ed.push({s,e,t,sf,o:o++});
 const nm=(n,p)=>n.id&&n.id.name||p&&(p.type==='VariableDeclarator'&&p.id.name||(p.type==='Property'||p.type==='MethodDefinition'||p.type==='PropertyDefinition')&&p.key&&p.key.name||p.type==='AssignmentExpression'&&p.left.property&&p.left.property.name)||'anonymous';
 const KIND={setTimeout:'timeout',setInterval:'interval',queueMicrotask:'micro'};
 const cb=(a,k)=>{if(/Function/.test(a.type)){const L=lineOf(a.start),lb=k+':L'+L;lbs.set(a,lb);add(a.start,a.start,'__lb('+JSON.stringify(lb)+','+L+',');add(a.end,a.end,')',1)}};
 const kids=n=>{for(const k in n){if(k==='type'||k==='start'||k==='end')continue;const v=n[k];if(Array.isArray(v))v.forEach(x=>walk(x,n));else if(v&&typeof v.type==='string')walk(v,n)}};
 function walk(n,par){
  if(!n||typeof n.type!=='string')return;const T=n.type;
  if(T==='CallExpression'){const c=n.callee;
   if(c.type==='Identifier'&&KIND[c.name]){add(c.start,c.end,'__S('+lineOf(c.start)+').'+c.name);if(n.arguments[0])cb(n.arguments[0],KIND[c.name])}
   else if(c.type==='MemberExpression'&&!c.computed&&c.property){const pn=c.property.name,ob=c.object;
    if(ob.type==='Identifier'&&ob.name==='console')add(ob.start,ob.end,'__K('+lineOf(c.start)+')');
    else if(pn==='then'||pn==='catch'||pn==='finally'){add(ob.start,ob.start,'__O('+lineOf(c.start)+',');add(ob.end,ob.end,')',1);n.arguments.forEach((a,i)=>cb(a,pn==='then'?(i?'catch':'then'):pn))}
    else if(ob.type==='Identifier'&&ob.name==='Promise')add(ob.start,ob.end,'__P('+lineOf(c.start)+')')}}
  else if(T==='NewExpression'&&n.callee.type==='Identifier'&&n.callee.name==='Promise'){add(n.callee.start,n.callee.end,'(__P('+lineOf(n.start)+'))');const a0=n.arguments[0];if(a0&&/Function/.test(a0.type))lbs.set(a0,'executor:L'+lineOf(a0.start))}
  else if(T==='AwaitExpression'){const id=aw.length;aw.push({line:lineOf(n.start),fn:fnS[fnS.length-1]||'script'});add(n.start,n.argument.start,'__rs('+id+',await __aw('+id+',');add(n.end,n.end,'))',1)}
  else if(/^(ForStatement|WhileStatement|DoWhileStatement|ForInStatement|ForOfStatement)$/.test(T)){const b=n.body;if(b.type==='BlockStatement')add(b.start+1,b.start+1,'__lp();');else{add(b.start,b.start,'{__lp();');add(b.end,b.end,'}',1)}}
  if(/^(FunctionDeclaration|FunctionExpression|ArrowFunctionExpression)$/.test(T)){
   const nn=nm(n,par),label=lbs.get(n)||((nn==='__main'?'script':nn+'()')),L=lineOf(n.start);fnS.push(label);
   const en='__en('+JSON.stringify(label)+','+L+');try{',ex='}finally{__ex('+JSON.stringify(label)+')}';
   if(n.body.type==='BlockStatement'){add(n.body.start+1,n.body.start+1,en);add(n.body.end-1,n.body.end-1,ex,1)}
   else{add(n.body.start,n.body.start,'{'+en+'return ');add(n.body.end,n.body.end,ex+'}',1)}
   kids(n);fnS.pop();return}
  kids(n)}
 walk(ast,null);
 let out=W;ed.sort((a,b)=>b.s-a.s||a.sf-b.sf||(a.sf?a.o-b.o:b.o-a.o)).forEach(x=>{out=out.slice(0,x.s)+x.t+out.slice(x.e)});
 return{code:out,aw}}

function mkFn(params,body){
 try{return new Function(...params,body)}
 catch(e){if(!(e instanceof EvalError)&&!/unsafe-eval|Content Security/i.test(String(e.message)))throw e;
  const sc=document.createElement('script');window.__simF=null;sc.textContent='window.__simF=function('+params.join(',')+'){'+body+'\n}';document.head.appendChild(sc);sc.remove();
  if(!window.__simF)throw new Error('Browser ne code chalane se roka (CSP).');return window.__simF}}

 function NP(ex){if(typeof ex!=='function')throw new TypeError('Promise resolver is not a function');
  const h={done:false,subs:[],out:null};let p;
  p=new RP((res,rej)=>ex(v=>{if(isT(v)){h.dead=true;if(p&&st.get(p)===h)st.delete(p)}else settle(h,'ok');res(v)},x=>{settle(h,'err');rej(x)}));

 NP.reject=v=>{const p=RP.reject(v);st.set(p,{done:true,out:'err',subs:[]});return p};
 ['all','allSettled','race','any'].forEach(k=>{if(RP[k])NP[k]=it=>RP[k](it)});
 const patched=function(f,r){const self=this,e=st.get(self),line=curLine,h2={done:false,subs:[],out:null};let q;
  const mk=fn=>typeof fn==='function'?{jid:++J,l:lbl(fn,'then:L'+line)}:null,jf=mk(f),jr=mk(r);
  const fin=(k,v)=>{if(k==='err')settle(h2,'err');else if(isT(v))st.delete(q);else settle(h2,'ok')};

  const wr=jr?wrap(r,jr.jid,jr.l,'micro',fin):function(x){settle(h2,'err');throw x};

function buildSteps(ev,over){
 const st=[],sch=new Set(),rm=(a,x)=>{const i=a.indexOf(x);if(i>=0)a.splice(i,1)};let depth=0,mic=0;

 const outs=ev.filter(e=>e.k==='log').map(e=>e.text);
 ev.forEach(e=>{switch(e.k){
  case 'log':ad('stack',e,'console.log chala. Console me aaya: '+e.text+'. Ye sync code hai, koi wait nahi.',()=>S.out.push(e.text));break;
  case 'push':depth++;ad('stack',e,e.label==='script'?'Script shuru! Tumhara poora code ek "script" ban kar Call Stack ghar me aaya. Jo code abhi chal raha hai, wahi stack me rehta hai.':e.label+' function call hua, wo Call Stack me upar aaya.',()=>S.stack.push(e.label));break;
  case 'pop':depth--;ad('stack',e,e.label+(depth<=0?' khatam. Call Stack khali ho gaya! Ab Event Loop (Chintu) ka kaam shuru.':' ka kaam khatam, wo Call Stack se bahar.'),()=>S.stack.pop());break;
  case 'timer':ad('web',e,e.label+' ko Web API (timer ki dukaan) me diya, '+e.ms+'ms wait karega. Chintu bola: tum wait karo, main apna kaam karta hu!',()=>S.web.push(e.label));break;
  case 'fire':ad('macro',e,'Timer ('+e.ms+'ms) khatam. Callback seedha stack me nahi jata, wo Task Queue (post office) me line me lagta hai.',()=>{rm(S.web,e.label);S.macro.push(e.label)});break;
  case 'clear':ad('web',e,e.label+' ka timer cancel (clear) ho gaya.',()=>rm(S.web,e.label));break;
  case 'sched':sch.add(e.jid);mic++;ad('micro',e,e.label+' ready hai, wo Microtask Queue (VIP ghar) me gaya. Ye VIP line Task Queue se pehle suni jaati hai.',()=>S.micro.push(e.label));break;
  case 'run':{const q=e.qlabel||e.label;
   if(e.type==='micro'){
    if(!sch.has(e.jid)){sch.add(e.jid);mic++;ad('micro',e,q+' ka Promise settle hua, wo Microtask Queue me aaya.',()=>S.micro.push(q))}
    mic--;ad('micro',e,(depth<=0?'Stack khali hai. ':'')+'Chintu ne pehle VIP Microtask ghar dekha aur '+q+' ko stack tak pahunchaya.',()=>{rm(S.micro,q);S.stack.push(e.label)})}
   else ad('macro',e,(depth<=0?'Stack khali. ':'')+(mic<=0?'Microtask queue bhi khali, ab Task Queue ki baari. ':'')+'Chintu '+q+' ko Task Queue se utha kar stack tak le gaya.',()=>{rm(S.macro,q);S.stack.push(e.label)});
   depth++;break}
  case 'note':ad('stack',e,e.text,()=>{});break}});

let editing=true,smi=0;
function setMode(e){editing=e;ed.hidden=!e;pre.hidden=e;smp.hidden=!e;err.hidden=!e;bt(runb,e?'play':'edit',e?'Visualize':'Edit code');cth.textContent=e?'Apna JavaScript code likho':'Tumhara code (chal raha hai)'}
ed.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();ed.setRangeText('  ',ed.selectionStart,ed.selectionEnd,'end')}});
smp.onclick=()=>{ed.value=SAMPLES[smi++%SAMPLES.length];err.textContent=''};

runb.onclick=async()=>{
 if(!editing){setMode(true);return}
 const src=ed.value;err.textContent='';
 if(!src.trim()){err.textContent='Pehle kuch JavaScript code likho (ya Example dabao).';return}
 if(!window.acorn){err.textContent='Parser load nahi hua. Internet check karke page reload karo.';return}
 runb.disabled=true;tx.innerHTML='<b>Chintu</b> ✉️<small>Tumhara code chala raha hu...</small>';
 let r;try{r=await simulate(src)}catch(e){r={error:'Error: '+(e&&e.message||e)}}
 runb.disabled=false;
 if(r.error){err.textContent=r.error;tx.innerHTML='<b>Chintu</b> ✉️<small>Code me dikkat hai, error theek karo.</small>';return}
 STEPS=buildSteps(r.ev,r.over);
 pre.innerHTML=src.split('\n').map((l,i)=>'<span class="ln" id="l'+i+'">'+(l.replace(/&/g,'&amp;').replace(/</g,'&lt;')||' ')+'</span>').join('');
 setMode(false);resetAll();if(innerWidth<600)codeP.classList.add('hide');
};
